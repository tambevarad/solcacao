name: CI
on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
jobs:
  verify:
    runs-on: ubuntu-latest
    # Real MongoDB for every member's persistence suite (Student 1 handoff proposal 2). Each suite
    # uses its own database or collections; without TEST_MONGODB_URI they are skipped locally.
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/solcacao_test_ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
# Phase 3: Student 2 adds real-mode browser tests; no mock substitution in that job.
